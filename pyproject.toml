[project]
name = "ezproxy-stanza-sync"
version = "0.1.0"
description = "Tool that checks the update of database stanza on OCUL website automatically"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pyinstaller>=6.20.0",
    "requests>=2.32.5",
    "typer>=0.24.1",
]

[project.scripts]
ezproxy = "src.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
